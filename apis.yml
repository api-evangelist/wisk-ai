    not published as a public, self-serve developer API. Customer API access is
    available on the Premium plan.
- aid: wisk-ai:wisk-ai-venues-api
  name: WISK Venues API
  tags:
  - Venues
  - Locations
  - Multi-Location
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.wisk.ai/
  properties:
  - url: https://help.wisk.ai/en/collections/2572511-new-user-guide
    type: Documentation
  - url: openapi/wisk-ai-openapi.yml
    type: OpenAPI
  description: Organizes inventory, users, and reporting per venue (location) for

name: WISK
kind: company
description: WISK is a bar, restaurant, and hospitality inventory and cost-management platform that tracks
  items, counts inventory across venues, scans and reconciles supplier invoices, and integrates with 60+
  POS systems to compare theoretical vs. actual usage. WISK's programmatic surface is partner-gated -
  a documented Public Sales upload API lets POS providers and partners push sales data into WISK, and
  customer API access is offered on the top (Premium) plan. There is no public, self-serve developer portal
  or published OpenAPI as of this catalog date.

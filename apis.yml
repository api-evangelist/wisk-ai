- aid: wisk-ai:wisk-ai-invoices-api
  name: WISK Invoices API
  tags:
  - Invoices
  - Cost Management
  - Reconciliation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.wisk.ai/
  properties:
  - url: https://help.wisk.ai/en/collections/2572511-new-user-guide
    type: Documentation
  - url: openapi/wisk-ai-openapi.yml
    type: OpenAPI
  description: Captures, AI-processes, and reconciles supplier invoices against
    purchases and pricing to track cost of goods. Available in the WISK product;
    not published as a public, self-serve developer API.
- aid: wisk-ai:wisk-ai-pos-integration-api
  name: WISK POS Integration (Public Sales Upload) API
  tags:
  - POS Integration
  - Sales
  - Partner
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.wisk.ai/pos
  properties:
  - url: https://help.wisk.ai/en/articles/5071983-integrating-with-wisk-for-pos-providers
    type: Documentation
  - url: openapi/wisk-ai-openapi.yml
    type: OpenAPI
  description: Partner-gated integration for POS providers to push sales data (POS
    code or item name, quantity sold, net sales) into WISK customer accounts via a
    documented Public Sales upload flow. WISK can alternatively pull from a POS
    provider's Sales and Product/Menu APIs, or ingest a daily sales report email.
    POS providers contact WISK partnerships to begin.

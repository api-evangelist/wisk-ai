    type: Documentation
  - url: openapi/wisk-ai-openapi.yml
    type: OpenAPI
  description: Partner-gated integration for POS providers to push sales data (POS code or item name,
    quantity sold, net sales) into WISK customer accounts via a documented Public Sales upload flow. WISK
    can alternatively pull from a POS provider's Sales and Product/Menu APIs, or ingest a daily sales
    report email. POS providers contact WISK partnerships to begin.

meters:
- name: location_subscription
  description: Per-location monthly subscription for the selected plan tier.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
  - plan
- name: implementation_fee
  description: One-time setup/implementation fee per plan tier and per location.
  unit: fees
  aggregation: sum
  dimensions:
  - account
  - location
  - plan
- name: ai_processed_invoices
  description: AI-processed supplier invoices per month, capped by plan tier.
  unit: invoices
  aggregation: sum
  dimensions:
  - account
  - location
- name: human_review_invoice_packs
  description: Optional human-reviewed invoice packs (auto-renewing) for beverage and food.
  unit: packs
  aggregation: sum
  dimensions:
  - account
  - pack
- name: food_addon_subscription
  description: Optional food module add-on subscription (requires Professional/Premium).
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
principles:
- name: Visibility
  description: >-
    Track WISK spend per location and plan tier; reconcile subscription invoices,
    implementation fees, and any human-review/food packs.
- name: Allocation
  description: >-
    Map per-location subscriptions to venues / cost centers; tag multi-location
    groups to their operating units.
- name: Optimization
  description: >-
    Right-size the plan tier to SKU count and invoice volume; only step up to
    Premium when custom reporting / API access is genuinely needed; choose annual
    billing for savings.
- name: Accountability
  description: >-
    Assign an owner per venue; review plan tier and invoice-pack consumption
    against budget each cycle.

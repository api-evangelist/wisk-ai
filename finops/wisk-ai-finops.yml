description: >-
  FinOps view of WISK spend. WISK bills as a per-location SaaS subscription
  (Essentials, Professional, Premium) on quarterly or annual terms with annual
  savings, plus one-time implementation/setup fees, optional human-review
  invoice packs, and food add-on modules. WISK is not a usage-metered API
  product; programmatic API access is bundled into the Premium tier rather than
  billed per call. POS integration is included at no extra cost. Cost drivers are
  therefore seat/location subscriptions and plan tier rather than API request
  volume.
notes: >-
  Plan prices and pack rates change; verify against the WISK pricing page during
  reconciliation. No per-request API metering is published, so API-call meters
  are not applicable.
